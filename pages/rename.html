<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ImgFetch, Rename before download</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <style>
    body { max-width: 560px; margin: 0 auto; padding: 28px 20px 60px; }
    .preview { width: 100%; border-radius: 8px; background: var(--surface-2); max-height: 300px; object-fit: contain; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  </style>
</head>
<body>
  <div class="brand" style="margin-bottom:16px;">
    <img class="brand-mark" src="../icons/icon-32.png" alt="" aria-hidden="true">
    <div>
      <div class="brand-name">ImgFetch</div>
      <div class="brand-sub">Name your download</div>
    </div>
  </div>

  <div class="card">
    <img id="preview" class="preview" alt="Image preview">
    <div class="field" style="margin-top:12px;">
      <label for="filename">File name</label>
      <input type="text" id="filename" autocomplete="off" spellcheck="false">
      <div class="hint" id="formatHint"></div>
    </div>
    <div class="actions">
      <button id="btnSave" class="btn btn-primary">Download</button>
      <button id="btnCancel" class="btn btn-ghost">Cancel</button>
    </div>
  </div>

  <script src="../shared/ui.js"></script>
    <script src="rename.js"></script>
</body>
</html>
